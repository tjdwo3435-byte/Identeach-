@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

/* ═══ CSS Variables (Brand: IDenTeach) ═══ */
:root {
  --accent: #1F2392;
  --accent-press: #161B78;
  --accent-soft: #ECEEFF;
  --yellow: #FFD84D;
  --ink: #14142B;
  --ink-2: #5A5A6E;
  --ink-3: #9E9EB0;
  --line: #E8E8F0;
  --line-2: #F2F2F6;
  --bg: #F5F5F8;
  --frame: #FFFFFF;
  --danger: #E53E3E;
  --success: #22C55E;
  --radius-card: 16px;
  --radius-btn: 14px;
  --radius-input: 12px;
  --radius-frame: 28px;
  --shadow-frame: 0 8px 60px rgba(20,20,43,0.12), 0 1px 4px rgba(20,20,43,0.06);
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
  --transition-screen: 0.35s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  height: 100%; overflow: hidden; -webkit-font-smoothing: antialiased;
}

/* ═══ App Frame ═══ */
.app-frame {
  width: 100%; max-width: 430px; height: 100vh; max-height: 100vh;
  margin: 0 auto; background: var(--frame); position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 500px) {
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .app-frame {
    height: min(92vh, 860px); border-radius: var(--radius-frame);
    box-shadow: var(--shadow-frame); border: 1px solid var(--line);
  }
}

/* ═══ Top Bar ═══ */
.top-bar {
  position: relative; z-index: 10; padding: 16px 20px 0; flex-shrink: 0;
  background: var(--frame);
}
.top-bar-row {
  display: flex; align-items: center; justify-content: center;
  position: relative; height: 36px;
}
.btn-back {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 6px;
  color: var(--ink-2); display: flex; align-items: center; justify-content: center;
  border-radius: 8px; transition: background 0.15s;
}
.btn-back:hover { background: var(--line-2); }
.btn-back svg { width: 22px; height: 22px; }
.step-counter { font-size: 14px; font-weight: 600; color: var(--ink-3); letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
.progress-track {
  margin-top: 12px; height: 3px; background: var(--line);
  border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.5s cubic-bezier(0.25,1,0.5,1); width: 0;
}

.top-bar[data-hidden="true"] { opacity: 0; pointer-events: none; }

/* ═══ Screen Area ═══ */
.screen-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; position: relative;
}
.screen {
  position: absolute; inset: 0; padding: 28px 24px 120px;
  opacity: 0; transform: translateY(18px);
  pointer-events: none;
  transition: opacity var(--transition-screen), transform var(--transition-screen);
  overflow-y: auto;
}
.screen.active {
  opacity: 1; transform: translateY(0); pointer-events: auto;
  position: relative;
}
.screen.exit { opacity: 0; transform: translateY(-12px); }

/* ═══ Bottom CTA ═══ */
.bottom-cta {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
  padding: 0 20px 24px;
}
.bottom-cta::before {
  content: ''; position: absolute; top: -40px; left: 0; right: 0; height: 40px;
  background: linear-gradient(transparent, var(--frame));
  pointer-events: none;
}
.cta-btn {
  width: 100%; padding: 17px; border: none; border-radius: var(--radius-btn);
  font-family: var(--font); font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background 0.2s, transform 0.1s, opacity 0.2s;
  letter-spacing: -0.3px;
  background: var(--accent); color: #fff;
}
.cta-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.cta-btn:not(:disabled):active { transform: scale(0.97); background: var(--accent-press); }

/* ═══ Start Screen ═══ */
.start-screen { text-align: center; padding-top: 48px !important; }
.start-logo {
  width: 48px; height: 48px; margin: 0 auto 28px;
  background: var(--accent); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px; font-weight: 900; letter-spacing: -1px;
}
.start-brand { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 6px; }
.start-title {
  font-size: 26px; font-weight: 800; line-height: 1.35;
  letter-spacing: -0.8px; word-break: keep-all; margin-bottom: 10px;
}
.start-sub { font-size: 14px; color: var(--ink-2); line-height: 1.55; margin-bottom: 36px; }

.start-cards { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.start-card {
  display: flex; align-items: center; gap: 14px;
  padding: 20px; background: var(--frame);
  border: 1.5px solid var(--line); border-radius: var(--radius-card);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.start-card:active { transform: scale(0.97); }
.start-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.start-card-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.start-card-text .sc-title { font-size: 15px; font-weight: 700; color: var(--ink); }
.start-card-text .sc-desc { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

.site-link {
  display: inline-block; margin-top: 26px;
  font-size: 13px; font-weight: 600; color: var(--ink-3);
  text-decoration: none; padding: 8px;
}
.site-link:hover { color: var(--accent); }

/* ═══ Question Title ═══ */
.q-title {
  font-size: 22px; font-weight: 800; line-height: 1.4;
  letter-spacing: -0.6px; word-break: keep-all; margin-bottom: 6px;
}
.q-sub { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-bottom: 24px; }

/* ═══ Selection Card ═══ */
.sel-list { display: flex; flex-direction: column; gap: 8px; }
.sel-card {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; background: var(--frame);
  border: 1.5px solid var(--line); border-radius: var(--radius-card);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.sel-card:active { transform: scale(0.97); }
.sel-card.selected { border-color: var(--accent); background: var(--accent-soft); }

.sel-label { flex: 1; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.sel-desc { font-size: 12px; font-weight: 400; color: var(--ink-2); display: block; margin-top: 1px; }

.sel-radio {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--line); transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.sel-card.selected .sel-radio { border-color: var(--accent); background: var(--accent); }
.sel-radio::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #fff; opacity: 0; transition: opacity 0.15s;
}
.sel-card.selected .sel-radio::after { opacity: 1; }

/* ═══ Multi Chip Grid ═══ */
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-item {
  padding: 10px 16px; background: var(--frame);
  border: 1.5px solid var(--line); border-radius: 50px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  color: var(--ink); transition: all 0.15s; user-select: none;
  white-space: nowrap;
}
.chip-item:active { transform: scale(0.95); }
.chip-item.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.etc-input-wrap {
  max-height: 0; overflow: hidden; transition: max-height 0.3s ease, margin 0.3s ease, opacity 0.3s ease;
  opacity: 0; margin-top: 0;
}
.etc-input-wrap.open { max-height: 60px; opacity: 1; margin-top: 10px; }
.etc-input {
  width: 100%; padding: 13px 16px; font-size: 14px; font-family: var(--font);
  border: 1.5px solid var(--line); border-radius: var(--radius-input);
  background: var(--frame); color: var(--ink); outline: none; font-weight: 500;
  transition: border-color 0.2s;
}
.etc-input:focus { border-color: var(--accent); }
.etc-input::placeholder { color: var(--ink-3); font-weight: 400; }

/* ═══ Program Cards ═══ */
.prog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prog-card {
  padding: 14px 14px; background: var(--frame);
  border: 1.5px solid var(--line); border-radius: var(--radius-card);
  cursor: pointer; transition: all 0.15s; user-select: none;
  position: relative;
}
.prog-card:active { transform: scale(0.96); }
.prog-card.selected { border-color: var(--accent); background: var(--accent-soft); }
.prog-card .pc-name { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.3; margin-bottom: 3px; padding-right: 22px; }
.prog-card .pc-desc { font-size: 11px; color: var(--ink-2); line-height: 1.35; }
.prog-card.selected .pc-name { color: var(--accent); }
.prog-card-check {
  position: absolute; top: 10px; right: 10px;
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid var(--line); transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.prog-card.selected .prog-card-check { border-color: var(--accent); background: var(--accent); }
.prog-card-check svg { width: 11px; height: 11px; color: #fff; opacity: 0; }
.prog-card.selected .prog-card-check svg { opacity: 1; }

.prog-card.full { grid-column: 1 / -1; text-align: center; }
.prog-card.full .pc-name { color: var(--ink-2); padding-right: 0; }

.prog-section { margin-bottom: 16px; }
.prog-cat-label {
  font-size: 13px; font-weight: 700; color: var(--ink-2);
  margin-bottom: 8px; padding-left: 2px; letter-spacing: -0.2px;
}

/* ═══ Month Grid ═══ */
.month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.month-item {
  padding: 13px 4px; text-align: center;
  background: var(--frame); border: 1.5px solid var(--line);
  border-radius: var(--radius-input); cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--ink);
  transition: all 0.15s; user-select: none;
}
.month-item:active { transform: scale(0.95); }
.month-item.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ═══ Input Fields ═══ */
.field-group { margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 7px; display: block; letter-spacing: 0.2px; }
.field-input {
  width: 100%; padding: 15px 16px; font-size: 15px; font-family: var(--font);
  font-weight: 500; border: 1.5px solid var(--line); border-radius: var(--radius-input);
  background: var(--frame); color: var(--ink); outline: none; transition: border-color 0.2s;
}
.field-input:focus { border-color: var(--accent); }
.field-input::placeholder { color: var(--ink-3); font-weight: 400; }
.field-row { display: flex; gap: 10px; }
.field-row .field-group { flex: 1; }
textarea.field-input { resize: none; height: 90px; line-height: 1.5; }

/* ═══ Consent ═══ */
.consent-box {
  background: var(--line-2); border-radius: var(--radius-input);
  padding: 14px 16px; font-size: 11.5px; color: var(--ink-2);
  line-height: 1.7; margin-bottom: 12px;
}
.consent-row {
  display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; user-select: none; padding: 4px 2px;
}
.consent-row input { display: none; }
.consent-mark {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--line); transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.consent-row input:checked + .consent-mark { border-color: var(--accent); background: var(--accent); }
.consent-mark svg { width: 12px; height: 12px; color: #fff; opacity: 0; transition: opacity 0.15s; }
.consent-row input:checked + .consent-mark svg { opacity: 1; }
.consent-text { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; }

/* ═══ Loading Screen ═══ */
.loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 100%; padding-top: 60px !important; }
.loading-icon {
  width: 72px; height: 72px; border-radius: 20px; background: var(--accent-soft);

}
.loading-shadow {
  width: 48px; height: 6px; border-radius: 50%;
  background: rgba(20,20,43,0.08); margin: 0 auto 28px;
  animation: breathe 2.5s ease-in-out infinite;
}
.loading-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.4px; }
.loading-checks { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; width: 100%; max-width: 240px; }
.loading-check-item {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 500; color: var(--ink-3);
  transition: color 0.3s;
}
.loading-check-item.done { color: var(--ink); }
.lc-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.loading-check-item.done .lc-dot { border-color: var(--success); background: var(--success); }
.lc-dot svg { width: 11px; height: 11px; color: #fff; opacity: 0; transition: opacity 0.2s; }
.loading-check-item.done .lc-dot svg { opacity: 1; }

@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes breathe { 0%,100% { transform: scaleX(1); opacity: 0.6; } 50% { transform: scaleX(0.6); opacity: 0.3; } }

/* ═══ Complete / Error Screen ═══ */
.complete-screen { text-align: center; padding-top: 40px !important; }
.complete-icon {
  width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
  background: #E8FFE8; display: flex; align-items: center; justify-content: center;
  font-size: 28px; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.complete-icon.warn { background: #FFF1E8; }
@keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.complete-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
.complete-sub { font-size: 14px; color: var(--ink-2); line-height: 1.55; margin-bottom: 28px; }

.summary-card {
  background: var(--frame); border: 1.5px solid var(--line);
  border-radius: var(--radius-card); padding: 18px; text-align: left;
  margin-bottom: 20px;
}
.summary-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 9px 0; border-bottom: 1px solid var(--line-2);
}
.summary-row:last-child { border-bottom: none; }
.summary-label { font-size: 13px; color: var(--ink-3); font-weight: 500; flex-shrink: 0; }
.summary-value { font-size: 13px; font-weight: 600; color: var(--ink); text-align: right; max-width: 62%; word-break: keep-all; line-height: 1.4; }

.action-btn {
  display: block; width: 100%; padding: 16px; margin-bottom: 10px;
  border: none; border-radius: var(--radius-btn);
  font-family: var(--font); font-size: 15px; font-weight: 700;
  background: var(--accent); color: #fff; cursor: pointer; text-decoration: none;

}
.action-btn:active { background: var(--accent-press); }
.action-btn.ghost { background: var(--line-2); color: var(--ink); }

.btn-restart {

  font-size: 14px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; padding: 10px; transition: color 0.15s;
}
.btn-restart:hover { color: var(--ink); }

/* ═══ Reduced Motion ═══ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }

  sms: '문자', sns: 'SNS', qr: 'QR코드', card: '명함', doc: '공문'
};
function getSource() {
  try {
    const raw = (new URLSearchParams(location.search).get('src') || '').trim().toLowerCase();
    if (!raw) return '홈페이지 직접 유입';
    return SRC_LABELS[raw] || raw;

}

/* ═══ FLOW ═══ */
const FLOW = ['start','q1','q2','q3','q4','q5','q6','q7','loading','complete'];
const TOTAL_Q = 7;

function getRenderer(id) {
  const map = { start: renderStart, q1: renderQ1, q2: renderQ2, q3: renderQ3, q4: renderQ4, q5: renderQ5, q6: renderQ6, q7: renderQ7, loading: renderLoading, complete: renderComplete, error: renderError };
  return map[id];
}

function showScreen(id) {
  const area = document.getElementById('screenArea');
  const prev = area.querySelector('.screen.active');

  const renderer = getRenderer(id);
  const tmp = document.createElement('div');
  tmp.innerHTML = renderer();
  const newScr = tmp.firstElementChild;
  area.appendChild(newScr);

  if (prev) {
    prev.classList.remove('active');
    prev.classList.add('exit');
    setTimeout(() => prev.remove(), 400);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => { newScr.classList.add('active'); });
  });

  currentScreen = id;
  updateChrome(id);

  if (['q6','q7'].includes(id)) {
    setTimeout(() => {
      const inp = newScr.querySelector('.field-input');
      if (inp) inp.focus();
    }, 400);
  }
}

function updateChrome(id) {
  const topBar = document.getElementById('topBar');
  const bottomCta = document.getElementById('bottomCta');
  const ctaBtn = document.getElementById('ctaBtn');
  const backBtn = document.getElementById('btnBack');
  const isQ = /^q\d+$/.test(id);
  const qNum = isQ ? parseInt(id.slice(1)) : 0;

  topBar.dataset.hidden = isQ ? 'false' : 'true';
  bottomCta.style.display = isQ ? '' : 'none';

  if (isQ) {
    document.getElementById('stepCounter').textContent = `${qNum} / ${TOTAL_Q}`;
    document.getElementById('progressFill').style.width = `${(qNum / TOTAL_Q) * 100}%`;
    backBtn.style.visibility = qNum > 1 ? 'visible' : 'hidden';
    ctaBtn.textContent = qNum === TOTAL_Q ? '제출하기' : '다음';
    validateCurrent();
  }
}

function validateCurrent() {
  const btn = document.getElementById('ctaBtn');
  if (!btn) return;
  let valid = false;

  switch (currentScreen) {
    case 'q1': valid = !!answers.school; break;
    case 'q2':
      valid = multiSets.category.has('기타')
        ? (multiSets.category.size > 0 && !!(answers.etcText||'').trim())
        : multiSets.category.size > 0;
      break;
    case 'q3': valid = !!answers.scale; break;
    case 'q4': valid = multiSets.program.size > 0; break;
    case 'q5': valid = !!answers.month; break;
    case 'q6':
      valid = !!(answers.schoolName||'').trim() && !!(answers.teacherName||'').trim()
           && !!(answers.phone||'').trim() && isEmail(answers.email) && !!answers.agree;
      break;
    case 'q7': valid = true; break;
  }
  btn.disabled = !valid;
}

/* ═══ INTERACTIONS ═══ */
function startFlow() { showScreen('q1'); }

function selectSingle(key, value, el, cls) {
  const parent = el.closest('.sel-list') || el.parentElement;
  parent.querySelectorAll(cls ? '.'+cls : '.sel-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  answers[key] = value;
  validateCurrent();
}

function toggleChip(setKey, value, el) {
  const set = multiSets[setKey];
  if (set.has(value)) { set.delete(value); el.classList.remove('selected'); }
  else { set.add(value); el.classList.add('selected'); }

  if (value === '기타') {
    const wrap = document.getElementById('etcWrap');
    if (set.has('기타')) {
      wrap.classList.add('open');
      setTimeout(() => document.getElementById('etcInput')?.focus(), 300);
    } else {
      wrap.classList.remove('open');
      answers.etcText = '';
    }
  }
  validateCurrent();
}

function onEtcInput(el) { answers.etcText = el.value; validateCurrent(); }

function toggleProgram(name, el) {
  const set = multiSets.program;
  if (set.has('아직 모르겠어요')) {
    set.delete('아직 모르겠어요');
    document.querySelector('.prog-card.full')?.classList.remove('selected');
  }
  if (set.has(name)) { set.delete(name); el.classList.remove('selected'); }
  else { set.add(name); el.classList.add('selected'); }
  validateCurrent();
}

function selectUnsure(el) {
  document.querySelectorAll('.prog-card').forEach(c => c.classList.remove('selected'));
  multiSets.program.clear();
  multiSets.program.add('아직 모르겠어요');
  el.classList.add('selected');
  validateCurrent();
}

function checkContact() {
  answers.schoolName = document.getElementById('fSchool')?.value || '';
  answers.teacherName = document.getElementById('fName')?.value || '';
  answers.phone = document.getElementById('fPhone')?.value || '';
  answers.email = document.getElementById('fEmail')?.value || '';
  validateCurrent();
}

function onAgree(el) { answers.agree = el.checked; validateCurrent(); }

function goNext() {
  if (document.getElementById('ctaBtn')?.disabled) return;
  const idx = FLOW.indexOf(currentScreen);
  if (idx < 0) return;

  if (currentScreen === 'q6') checkContact();
  if (currentScreen === 'q7') answers.memo = document.getElementById('fMemo')?.value?.trim() || '';

  const next = FLOW[idx + 1];
  if (!next) return;

  if (next === 'loading') { submitInquiry(); return; }
  showScreen(next);
}

function goBack() {
  const idx = FLOW.indexOf(currentScreen);
  if (idx <= 1) return;
  showScreen(FLOW[idx - 1]);
}

/* ═══ SUBMIT ═══ */
function buildPayload() {
  return {
    _subject: `[맞춤 제안 요청] ${answers.schoolName || ''} / ${answers.teacherName || ''}`,
    '학교급': answers.school || '-',
    '관심 분야': [...multiSets.category].join(', ') + (answers.etcText ? ` (${answers.etcText})` : ''),
    '참여 규모': answers.scale || '-',
    '관심 프로그램': [...multiSets.program].join(', ') || '-',
    '희망 시기': answers.month || '-',
    '학교명': answers.schoolName || '-',
    '담당자 성함': answers.teacherName || '-',
    '연락처': answers.phone || '-',
    '이메일': answers.email || '-',
    '요청사항': answers.memo || '-',
    '개인정보 동의': answers.agree ? '동의함' : '미동의',
    '유입 경로': INQUIRY_SOURCE,
  };
}

function buildMailBody() {
  const p = buildPayload();
  const lines = ['[아이덴티치 프로그램 문의]', ''];
  Object.keys(p).forEach(k => { if (k !== '_subject') lines.push(`${k}: ${p[k]}`); });
  return lines.join('\n');
}

function sendByMail() {
  const subject = encodeURIComponent(buildPayload()._subject);
  const body = encodeURIComponent(buildMailBody());
  window.location.href = `mailto:${CONFIG.emailTo}?subject=${subject}&body=${body}`;
}

async function submitInquiry() {
  if (submitting) return;
  submitting = true;

  showScreen('loading');
  const checks = ['lc0','lc1','lc2','lc3'];
  const timers = checks.slice(0, 2).map((id, i) =>
    setTimeout(() => document.getElementById(id)?.classList.add('done'), 500 + i * 600));

  const started = Date.now();
  let ok = false;

  if (CONFIG.formEndpoint) {
    try {
      const res = await fetch(CONFIG.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(buildPayload()),
      });
      ok = res.ok;
    } catch (e) { ok = false; }
  }

  /* 최소 1.8초는 로딩을 보여줘 화면이 튀지 않게 */
  const wait = Math.max(0, 1800 - (Date.now() - started));
  await new Promise(r => setTimeout(r, wait));
  timers.forEach(clearTimeout);
  submitting = false;

  if (ok) {
    document.getElementById('lc2')?.classList.add('done');
    setTimeout(() => {
      document.getElementById('lc3')?.classList.add('done');
      setTimeout(() => showScreen('complete'), 500);
    }, 400);
  } else {
    showScreen('error');
  }
}

function resetAll() {
  answers = {};
  multiSets = { category: new Set(), program: new Set() };
  showScreen('start');
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (currentScreen === 'start') { startFlow(); return; }
    if (/^q\d+$/.test(currentScreen) && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      goNext();
    }
  }
});
