<script>
/* ── 타이밍 변수 (CSS 변수와 동기) ─────────────────────── */
const SWISH = 420;    // ms: 슬라이드 전환
const HOLD1 = 1100;   // ms: "Do it" 유지
const HOLD2 = 1200;   // ms: "Do IdenTeach" 유지

/* ── 스테이지 측정값 (SVG user-unit) ──────────────────── */
const SW = 700, SH = 100;

const DO_W = 115, DO_H = 57;
const IT_W = 75;
const IN_W = 375, IN_H = 62;

const GAP_DI = 22;   // Do ↔ it 간격
const GAP_DN = 28;   // Do ↔ IdenTeach 간격

/* 수직 정렬: Do 기준 센터링 */
const TY = (SH - DO_H) / 2;  // ≈ 21.5

/* ── 각 스테이지별 X 좌표 ─────────────────────────────── */
/* Stage 1: "Do it" 중앙 */
const S1_DO   = (SW - DO_W - GAP_DI - IT_W)  / 2;
const S1_IT   = S1_DO + DO_W + GAP_DI;

/* Stage 2: "Do IdenTeach" 중앙 */
const S2_DO   = (SW - DO_W - GAP_DN - IN_W) / 2;
const S2_IDEN = S2_DO + DO_W + GAP_DN;

/* Stage 3: "IdenTeach" 단독 중앙 */
const S3_IDEN = (SW - IN_W) / 2;

/* ── DOM 참조 ─────────────────────────────────────────── */
const gDo   = document.getElementById('gDo');
const gIt   = document.getElementById('gIt');
const gIden = document.getElementById('gIden');

/* ── 이징: cubic-bezier(0.85,0,0.15,1) 근사 ────────────
   급출발·급정지 "획" 느낌 */
function ease(t) {
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ── 애니메이션 엔진 ────────────────────────────────────
   SVG attribute transform을 rAF로 직접 제어 (CSS px 단위 오염 없음) */
const running = new Map();

function go(el, x0, y0, x1, y1, a0, a1, dur, delay = 0, done = null) {
  if (running.has(el)) cancelAnimationFrame(running.get(el));
  const t0 = performance.now() + delay;

  function tick(now) {
    if (now < t0) { running.set(el, requestAnimationFrame(tick)); return; }
    const raw = Math.min((now - t0) / dur, 1);
    const e   = ease(raw);
    el.setAttribute('transform', `translate(${x0 + (x1 - x0) * e},${y0 + (y1 - y0) * e})`);
    el.setAttribute('opacity',   (a0 + (a1 - a0) * e).toFixed(3));
    if (raw < 1) running.set(el, requestAnimationFrame(tick));
    else if (done) done();
  }
  running.set(el, requestAnimationFrame(tick));
}

/* ── 초기 상태 (모두 숨김) ──────────────────────────── */
gDo  .setAttribute('transform', `translate(${S1_DO},${TY})`);   gDo  .setAttribute('opacity','0');
gIt  .setAttribute('transform', `translate(${S1_IT},${TY})`);   gIt  .setAttribute('opacity','0');
gIden.setAttribute('transform', `translate(${SW+60},${TY})`);   gIden.setAttribute('opacity','0');

/* ── Stage 1 (0ms): "Do it" 등장 ────────────────────── */
// Do: 왼쪽에서 슬라이드 인
go(gDo,  S1_DO - 80, TY, S1_DO, TY, 0, 1, SWISH);
// it: 오른쪽에서 슬라이드 인 (60ms 지연)
go(gIt,  S1_IT + 80, TY, S1_IT, TY, 0, 1, SWISH, 60);

/* ── Stage 2 (HOLD1 ms): it 탈출 → IdenTeach 진입 ───── */
setTimeout(() => {
  /* it: 위로 빠르게 사라짐 */
  go(gIt,   S1_IT,   TY, S1_IT,   TY - 90, 1, 0, SWISH);
  /* Do: 새 위치로 이동 */
  go(gDo,   S1_DO,   TY, S2_DO,   TY,      1, 1, SWISH);
  /* IdenTeach: 오른쪽에서 슬라이드 인 */
  go(gIden, SW + 60, TY, S2_IDEN, TY,      0, 1, SWISH);
}, HOLD1);

/* ── Stage 3 (HOLD1+HOLD2 ms): Do 퇴장 → IdenTeach 중앙 */
setTimeout(() => {
  /* Do: 왼쪽으로 빠르게 사라짐 */
  go(gDo,   S2_DO,   TY, -180,     TY, 1, 0, SWISH);
  /* IdenTeach: 중앙으로 이동 */
  go(gIden, S2_IDEN, TY, S3_IDEN,  TY, 1, 1, SWISH);
}, HOLD1 + HOLD2);
</script>
