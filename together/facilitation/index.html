/* ══════════════════════════════════════════════════════

const NAV_ITEMS = [
  { label:"어울림 프로그램", href:"/together" },
  { label:"진로 프로그램",   href:"/career" },
  { label:"교내 행사",       href:"/events" },
  { label:"회사소개",        href:"/about" }
];

function nl(s){ return (s||'').replace(/\n/g,'<br>') }
function dp(n, yellow){ const c=yellow?'dp dp-y':'dp'; return Array.from({length:n},()=>`<div class="${c}"></div>`).join('') }

function structVis(type, i) {
  if (type === 'line') {
    return `<div class="sv-row">${dp(10)}</div>`;
  }
  if (type === 'corner') {
    return `
      <div class="sv-col">
        ${dp(3)}
        <div class="sv-row">${dp(7)}</div>
      </div>`;
  }
  if (type === 'zones') {
    return `
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="display:flex;gap:14px;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀A</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀B</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀C</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
        </div>
        <div style="font-size:10px;color:var(--gray)">↓ 연결</div>
        <div class="sv-row">${dp(7,true)}</div>
      </div>`;
  }
  /* default: colored number circle */
  return `<div style="width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900">${i+1}</div>`;
}

function renderNav(active) {
  document.getElementById('nav-links').innerHTML = NAV_ITEMS.map(item =>
    `<a href="${item.href}"${item.href===active?' class="nav-active"':''}>${item.label}</a>`
  ).join('');
}

function renderCrumb(crumbs) {
  document.getElementById('pg-crumb').innerHTML = crumbs.map((c,i) =>
    i < crumbs.length-1
      ? `<a href="${c.href}">${c.label}</a><span class="crumb-sep">›</span>`
      : `<span>${c.label}</span>`
  ).join('');
}

function renderMeta(d) {
  document.getElementById('pg-title').textContent = d.pageTitle;
  document.getElementById('pg-desc').content      = d.pageDesc;
  document.getElementById('pg-canonical').href    = d.canonicalUrl;
}

function renderHero(d) {
  const imgs = d.heroImages || (d.heroImage ? [d.heroImage] : []);
  let banner;
  if (imgs.length === 0) {
    banner = `<div class="hero-slider"><div class="hero-banner-empty">활동 사진을 넣어주세요</div></div>`;
  } else if (imgs.length === 1) {
    banner = `<div class="hero-slider"><div class="hs-track"><div class="hs-slide"><img src="${imgs[0].src}" alt="${imgs[0].alt}" loading="eager"></div></div></div>`;
  } else {
    const slides = imgs.map(img=>`<div class="hs-slide"><img src="${img.src}" alt="${img.alt}" loading="eager"></div>`).join('');
    const dots   = imgs.map((_,i)=>`<button class="hs-dot${i===0?' active':''}" aria-label="슬라이드 ${i+1}"></button>`).join('');
    banner = `<div class="hero-slider"><div class="hs-track">${slides}</div><div class="hs-dots">${dots}</div></div>`;
  }
  return `
${banner}
<div class="hero-info">
  <div class="wrap">
    <div class="hero-tagline">${d.tagline}</div>
    <h1 class="hero-h1">${d.title}</h1>
    <p class="hero-sub">${nl(d.description)}</p>
    <div class="info-strip">
      ${d.info.map(item=>`
      <div class="info-chip">
        <div>
          <div class="info-chip-label">${item.label}</div>
          <div class="info-chip-val">${item.value}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}
function initHeroSlider() {
  const track = document.querySelector('.hs-track');
  const dots  = document.querySelectorAll('.hs-dot');
  if (!track || track.children.length < 2) return;
  const total = track.children.length;
  let cur = 0;
  function go(n) {
    cur = (n + total) % total;
    track.style.transform = `translateX(-${cur * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === cur));
  }
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  setInterval(() => go(cur + 1), 5000);
}

function renderActivity(a) {
  const imgHtml = a.image.src
    ? `<img src="${a.image.src}" alt="${a.image.alt}" loading="lazy">`
    : '';
  return `
<section class="sec sec--warm">
  <div class="wrap">
    <div class="activity-grid">
      <div class="activity-photo">${imgHtml}</div>
      <div>
        <span class="activity-eyebrow">PROGRAM OVERVIEW</span>
        <h2 class="activity-h2">${nl(a.headline)}</h2>
        <div class="bullet-list">
          ${a.bullets.map(b=>`
          <div class="bullet-item">
            <div class="bullet-dot"></div>
            <span>${b}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>
</section>`;
}

function renderUseCases(cases){
  const boxes=cases.map(c=>`<div class="use-box${c.rec?' use-box--rec':' use-box--norm'}">${c.rec?'<span class="use-rec-badge">⭐ 추천</span>':''}<div class="use-icon">${c.icon}</div><div class="use-title">${c.title}</div><div class="use-desc">${c.desc}</div></div>`).join('');
  return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활용 장면</span><h2 class="sec-h2" style="margin-bottom:0">어디서, 언제 쓸 수 있나요?</h2><div class="use-grid">${boxes}</div></div></section>`
}

function renderFlowSection(steps){
  const items=steps.map((s,i)=>`<div class="flow-item"><div class="flow-left"><div class="flow-num-wrap"><span class="flow-emoji">${s.icon}</span></div></div><div class="flow-right"><div class="flow-proc"><div class="flow-proc-step">STEP ${String(i+1).padStart(2,'0')} · 진행 흐름</div><div class="flow-proc-title">${s.proc.title}</div><div class="flow-proc-desc">${s.proc.desc}</div></div><div class="flow-xp"><div class="flow-xp-step">이 순간 학생들은</div><div class="flow-xp-action">${nl(s.xp.action)}</div><div class="flow-xp-detail">${s.xp.detail}</div></div></div></div>`).join('');
  return`<section class="flow-section"><div class="wrap"><div class="flow-dual-label"><span class="flow-badge flow-badge--proc">진행 흐름</span><span class="flow-badge flow-badge--xp">이 활동에서 학생들은</span></div><h2 class="sec-h2" style="margin-bottom:40px">활동이 이렇게 흘러갑니다</h2><div class="flow-timeline">${items}</div></div></section>`
}

function renderStructures(d) {
  return `
<section class="sec sec--warm">
  <div class="wrap">
    <span class="sec-label">${d.structuresSection.label}</span>
    <h2 class="sec-h2">${d.structuresSection.title}</h2>
    <div class="struct-grid">
      ${d.structuresSection.items.map((s,i)=>`
      <div class="struct-card">
        <div class="struct-vis">${structVis(s.type, i)}</div>
        <div class="struct-name">${s.name}</div>
        <div class="struct-desc">${s.desc}</div>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

function renderGallery(g){const imgs=g.images.map(img=>`<div class="g-frame"><img src="${img.src}" alt="${img.alt}" loading="lazy"></div>`).join("");return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활동 모습</span><h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2></div><div class="gallery-marquee"><div class="g-track">${imgs}${imgs}</div></div></section>`}

function renderCTA(){return`<div style="position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;align-items:flex-end"><a href="/assets/documents/identeach-program-guide.pdf" download style="display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy);font-family:inherit;font-weight:800;font-size:14px;padding:13px 22px;border-radius:18px 18px 0 18px;text-decoration:none;box-shadow:0 6px 24px rgba(20,20,43,.28);white-space:nowrap">📄 프로그램 소개서 받기</a><div style="width:0;height:0;border-style:solid;border-width:12px 12px 0 0;border-color:var(--yellow) transparent transparent transparent"></div></div>`}
function renderPage(d){renderMeta(d);renderNav(d.navActive);renderCrumb(d.crumbs);document.getElementById('pg-root').innerHTML=renderHero(d)+renderActivity(d.activity)+renderUseCases(d.useCases)+renderFlowSection(d.flowSteps)+renderGallery(d.gallery)+renderCTA();initHeroSlider();}
renderPage(programData);
</script>
