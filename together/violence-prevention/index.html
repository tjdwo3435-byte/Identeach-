function renderHero(d){const b=d.heroImage.src?`<div class="hero-banner"><img src="${d.heroImage.src}" alt="${d.heroImage.alt}" loading="eager"></div>`:`<div class="hero-banner"><div class="hero-banner-empty">활동 사진을 넣어주세요</div></div>`;return`${b}<div class="hero-info"><div class="wrap"><div class="hero-tagline">${d.tagline}</div><h1 class="hero-h1">${d.title}</h1><p class="hero-sub">${nl(d.description)}</p><div class="info-strip">${d.info.map(x=>`<div class="info-chip"><div><div class="info-chip-label">${x.label}</div><div class="info-chip-val">${x.value}</div></div></div>`).join('')}</div></div></div>`}
function renderActivity(a){const img=a.image.src?`<img src="${a.image.src}" alt="${a.image.alt}" loading="lazy">`:'';return`<section class="sec sec--warm"><div class="wrap"><div class="activity-grid"><div class="activity-photo">${img}</div><div><span class="activity-eyebrow">PROGRAM OVERVIEW</span><h2 class="activity-h2">${nl(a.headline)}</h2><div class="bullet-list">${a.bullets.map(b=>`<div class="bullet-item"><div class="bullet-dot"></div><span>${b}</span></div>`).join('')}</div></div></div></div></section>`}
function renderKeywords(kws){return`<section class="sec sec--white"><div class="wrap"><div class="kw-sec-title">활용 장면</div><h2 class="kw-h2">어디서, 언제 쓸 수 있나요?</h2><div class="kw-wrap">${kws.map(k=>`<span class="kw-chip kw-chip--${k.type}">${k.label}</span>`).join('')}</div></div></section>`}
function renderStudentXP(items){return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">이 활동에서 학생들은</span><div class="xp-grid">${items.map((x,i)=>`<div class="xp-card"><div class="xp-num">${String(i+1).padStart(2,'0')}</div><div class="xp-action">${nl(x.action)}</div><div class="xp-detail">${x.detail}</div></div>`).join('')}</div></div></section>`}
function renderProcess(proc){return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">진행 흐름</span><h2 class="sec-h2">이렇게 진행됩니다</h2><div class="proc-row">${proc.steps.map((s,i)=>`<div class="proc-step"><div class="proc-num">${i+1}</div><div class="proc-body"><div class="proc-title">${s.title}</div><div class="proc-desc">${s.desc}</div></div></div>`).join('')}</div></div></section>`}
function renderStructures(d){const sec=d.structuresSection;return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">${sec.label}</span><h2 class="sec-h2">${sec.title}</h2><div class="struct-grid">${sec.items.map((s,i)=>`<div class="struct-card"><div class="struct-vis">${structVis(s.type,i)}</div><div class="struct-name">${s.name}</div><div class="struct-desc">${s.desc}</div></div>`).join('')}</div></div></section>`}
function renderGallery(g){return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활동 모습</span><h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2><div class="gallery-grid">${g.images.map(img=>`<div class="g-item"><div class="g-frame"><img src="${img.src}" alt="${img.alt}" loading="lazy"></div><p class="g-cap">${img.caption}</p></div>`).join('')}</div></div></section>`}
function renderCTA(){return`<section style="background:var(--navy);text-align:center;padding:clamp(52px,7vw,80px) 0"><div class="wrap"><div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.4);margin-bottom:16px">PROGRAM GUIDE</div><h2 style="color:#fff;font-size:clamp(20px,3.5vw,30px);font-weight:800;line-height:1.3;margin-bottom:10px">더 자세한 내용이 궁금하신가요?</h2><p style="color:rgba(255,255,255,.55);font-size:clamp(14px,1.8vw,16px);margin-bottom:32px">프로그램 소개서를 무료로 받아보세요</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a href="/assets/documents/identeach-program-guide.pdf" download style="display:inline-flex;align-items:center;background:var(--yellow);color:var(--navy);font-family:inherit;font-weight:800;font-size:15px;padding:14px 28px;border-radius:999px;text-decoration:none">프로그램 소개서 받기</a><a href="/request" style="display:inline-flex;align-items:center;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);font-family:inherit;font-weight:600;font-size:15px;padding:14px 28px;border-radius:999px;text-decoration:none">무료 맞춤 상담</a></div></div></section>`}
function renderPage(d){renderMeta(d);renderNav(d.navActive);renderCrumb(d.crumbs);document.getElementById('pg-root').innerHTML=renderHero(d)+renderActivity(d.activity)+renderKeywords(d.keywords)+renderStudentXP(d.studentExperiences)+renderProcess(d.process)+renderStructures(d)+renderGallery(d.gallery)+renderCTA()}
renderPage(programData);
</script>
</body>
</html>
