  structures: [
    {
      name: "일자 연결형",
      type: "line",

    {

  gallery: {

      { src:"/assets/images/programs/together/domino/도미노사진4.jpg", alt:"연결 챌린지 장면",       caption:"연결 챌린지" },
      { src:"/assets/images/programs/together/domino/도미노사진5.jpg", alt:"전체 연결 성공 장면",    caption:"전체 연결 성공" },

/* ══════════════════════════════════════════════════════
   렌더링 엔진 — 수정 불필요
══════════════════════════════════════════════════════ */

const NAV_ITEMS = [
  { label:"어울림 프로그램", href:"/together" },
  { label:"진로 프로그램",   href:"/career" },
  { label:"교내 행사",       href:"/events" },
  { label:"회사소개",        href:"/about" }
];

function nl(s){ return (s||'').replace(/\n/g,'<br>') }
function dp(n, yellow){ const c=yellow?'dp dp-y':'dp'; return Array.from({length:n},()=>`<div class="${c}"></div>`).join('') }

/* 구조 시각화 */
function structVis(type) {
  if (type === 'line') {
    return `<div class="sv-row">${dp(10)}</div>`;
  }
  if (type === 'corner') {
    return `
      <div class="sv-col">
        ${dp(3)}
        <div class="sv-row">${dp(7)}</div>
      </div>`;
  }
  if (type === 'zones') {
    return `
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="display:flex;gap:14px;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀A</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀B</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀C</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
        </div>
        <div style="font-size:10px;color:var(--gray)">↓ 연결</div>
        <div class="sv-row">${dp(7,true)}</div>
      </div>`;
  }
  return '';
}

function renderNav(active) {
  document.getElementById('nav-links').innerHTML = NAV_ITEMS.map(item =>
    `<a href="${item.href}"${item.href===active?' class="nav-active"':''}>${item.label}</a>`
  ).join('');
}

function renderCrumb(crumbs) {
  document.getElementById('pg-crumb').innerHTML = crumbs.map((c,i) =>
    i < crumbs.length-1
      ? `<a href="${c.href}">${c.label}</a><span class="crumb-sep">›</span>`
      : `<span>${c.label}</span>`
  ).join('');
}

function renderMeta(d) {
  document.getElementById('pg-title').textContent = d.pageTitle;
  document.getElementById('pg-desc').content      = d.pageDesc;
  document.getElementById('pg-canonical').href    = d.canonicalUrl;
}

/* ─ [A] 히어로 ─ */
function renderHero(d) {
  const banner = d.heroImage.src
    ? `<div class="hero-banner"><img src="${d.heroImage.src}" alt="${d.heroImage.alt}" loading="eager"></div>`
    : `<div class="hero-banner"><div class="hero-banner-empty">활동 사진을 넣어주세요</div></div>`;

  return `
${banner}
<div class="hero-info">
  <div class="wrap">
    <div class="hero-tagline">${d.tagline}</div>
    <h1 class="hero-h1">${d.title}</h1>
    <p class="hero-sub">${nl(d.description)}</p>
    <div class="info-strip">
      ${d.info.map(item=>`
      <div class="info-chip">
        <div>
          <div class="info-chip-label">${item.label}</div>
          <div class="info-chip-val">${item.value}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}

/* ─ [B] 활동 이미지 + 요약 ─ */
function renderActivity(a) {
  const imgHtml = a.image.src
    ? `<img src="${a.image.src}" alt="${a.image.alt}" loading="lazy">`
    : '';
  return `
<section class="sec sec--warm">
  <div class="wrap">
    <div class="activity-grid">
      <div class="activity-photo">${imgHtml}</div>
      <div>
        <span class="activity-eyebrow">PROGRAM OVERVIEW</span>
        <h2 class="activity-h2">${nl(a.headline)}</h2>
        <div class="bullet-list">
          ${a.bullets.map(b=>`
          <div class="bullet-item">
            <div class="bullet-dot"></div>
            <span>${b}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>
</section>`;
}

/* ─ [C] 활용 키워드 ─ */
function renderKeywords(kws) {
  return `
<section class="sec sec--white">
  <div class="wrap">
    <div class="kw-sec-title">활용 장면</div>
    <h2 class="kw-h2">어디서, 언제 쓸 수 있나요?</h2>
    <div class="kw-wrap">
      ${kws.map(k=>`<span class="kw-chip kw-chip--${k.type}">${k.label}</span>`).join('')}
    </div>
  </div>
</section>`;
}

/* ─ [D] 이 활동에서 학생들은 ─ */
function renderStudentXP(items) {
  return `
<section class="sec sec--warm">
  <div class="wrap">
    <span class="sec-label">이 활동에서 학생들은</span>
    <div class="xp-grid">
      ${items.map((x,i)=>`
      <div class="xp-card">
        <div class="xp-num">${String(i+1).padStart(2,'0')}</div>
        <div class="xp-action">${nl(x.action)}</div>
        <div class="xp-detail">${x.detail}</div>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

/* ─ [E] 이렇게 진행됩니다 ─ */
function renderProcess(proc) {
  return `
<section class="sec sec--white">
  <div class="wrap">
    <span class="sec-label">진행 흐름</span>
    <h2 class="sec-h2">이렇게 진행됩니다</h2>
    <div class="proc-row">
      ${proc.steps.map((s,i)=>`
      <div class="proc-step">
        <div class="proc-num">${i+1}</div>
        <div class="proc-body">
          <div class="proc-title">${s.title}</div>
          <div class="proc-desc">${s.desc}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

/* ─ [F] 도미노 구조 예시 ─ */
function renderStructures(structs) {
  return `
<section class="sec sec--warm">
  <div class="wrap">
    <span class="sec-label">구조 예시</span>
    <h2 class="sec-h2">도미노 구조 예시</h2>
    <div class="struct-grid">
      ${structs.map(s=>`
      <div class="struct-card">
        <div class="struct-vis">${structVis(s.type)}</div>
        <div class="struct-name">${s.name}</div>
        <div class="struct-desc">${s.desc}</div>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

/* ─ [G] 갤러리 ─ */
function renderGallery(g) {
  return `
<section class="sec sec--white">
  <div class="wrap">
    <span class="sec-label">활동 모습</span>
    <h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2>
    <div class="gallery-grid">
      ${g.images.map(img=>`
      <div class="g-item">
        <div class="g-frame"><img src="${img.src}" alt="${img.alt}" loading="lazy"></div>
        <p class="g-cap">${img.caption}</p>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

/* ── CTA ── */
function renderCTA(){return`<div style="position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;align-items:flex-end"><a href="/assets/documents/identeach-program-guide.pdf" download style="display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy);font-family:inherit;font-weight:800;font-size:14px;padding:13px 22px;border-radius:18px 18px 0 18px;text-decoration:none;box-shadow:0 6px 24px rgba(20,20,43,.28);white-space:nowrap">📄 프로그램 소개서 받기</a><div style="width:0;height:0;border-style:solid;border-width:12px 12px 0 0;border-color:var(--yellow) transparent transparent transparent"></div></div>`}

/* ── 진입점 ── */
function renderPage(d) {
  renderMeta(d);
  renderNav(d.navActive);
  renderCrumb(d.crumbs);
  document.getElementById('pg-root').innerHTML =
    renderHero(d) +
    renderActivity(d.activity) +
    renderKeywords(d.keywords) +
    renderStudentXP(d.studentExperiences) +
    renderProcess(d.process) +
    renderStructures(d.structures) +
    renderGallery(d.gallery) +
    renderCTA();
}

renderPage(programData);
</script>
