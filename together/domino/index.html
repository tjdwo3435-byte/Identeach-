const NAV_ITEMS = [

function nl(s){ return (s||'').replace(/\n/g,'<br>') }
function dp(n, yellow){ const c=yellow?'dp dp-y':'dp'; return Array.from({length:n},()=>`<div class="${c}"></div>`).join('') }

/* 구조 시각화 */
function structVis(type) {
  if (type === 'line') {
    return `<div class="sv-row">${dp(10)}</div>`;
  }
  if (type === 'corner') {
    return `
      <div class="sv-col">
        ${dp(3)}
        <div class="sv-row">${dp(7)}</div>
      </div>`;
  }
  if (type === 'zones') {
    return `
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="display:flex;gap:14px;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀A</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀B</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:9px;color:var(--gray);font-weight:700;margin-bottom:3px">팀C</span>
            <div class="sv-row">${dp(3)}</div>
          </div>
        </div>
        <div style="font-size:10px;color:var(--gray)">↓ 연결</div>
        <div class="sv-row">${dp(7,true)}</div>
      </div>`;
  }
  return '';
}

function renderNav(active) {
  document.getElementById('nav-links').innerHTML = NAV_ITEMS.map(item =>
    `<a href="${item.href}"${item.href===active?' class="nav-active"':''}>${item.label}</a>`
  ).join('');
}

function renderCrumb(crumbs) {
  document.getElementById('pg-crumb').innerHTML = crumbs.map((c,i) =>
    i < crumbs.length-1
      ? `<a href="${c.href}">${c.label}</a><span class="crumb-sep">›</span>`
      : `<span>${c.label}</span>`
  ).join('');
}

function renderMeta(d) {
  document.getElementById('pg-title').textContent = d.pageTitle;
  document.getElementById('pg-desc').content      = d.pageDesc;
  document.getElementById('pg-canonical').href    = d.canonicalUrl;
}

/* ─ [A] 히어로 ─ */
function renderHero(d) {
  const imgs = d.heroImages || (d.heroImage ? [d.heroImage] : []);
  let banner;
  if (imgs.length === 0) {
    banner = `<div class="hero-slider"><div class="hero-banner-empty">활동 사진을 넣어주세요</div></div>`;
  } else if (imgs.length === 1) {
    banner = `<div class="hero-slider"><div class="hs-track"><div class="hs-slide"><img src="${imgs[0].src}" alt="${imgs[0].alt}" loading="eager"></div></div></div>`;
  } else {
    const slides = imgs.map(img=>`<div class="hs-slide"><img src="${img.src}" alt="${img.alt}" loading="eager"></div>`).join('');
    const dots   = imgs.map((_,i)=>`<button class="hs-dot${i===0?' active':''}" aria-label="슬라이드 ${i+1}"></button>`).join('');
    banner = `<div class="hero-slider"><div class="hs-track">${slides}</div><div class="hs-dots">${dots}</div></div>`;
  }
  return `
${banner}
<div class="hero-info">
  <div class="wrap">
    <div class="hero-tagline">${d.tagline}</div>
    <h1 class="hero-h1">${d.title}</h1>
    <p class="hero-sub">${nl(d.description)}</p>
    <div class="info-strip">
      ${d.info.map(item=>`
      <div class="info-chip">
        <div>
          <div class="info-chip-label">${item.label}</div>
          <div class="info-chip-val">${item.value}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}
function initHeroSlider() {
  const track = document.querySelector('.hs-track');
  const dots  = document.querySelectorAll('.hs-dot');
  if (!track || track.children.length < 2) return;
  const total = track.children.length;
  let cur = 0;
  function go(n) {
    cur = (n + total) % total;
    track.style.transform = `translateX(-${cur * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === cur));
  }
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  setInterval(() => go(cur + 1), 5000);
}

      <div class="activity-photo">${imgHtml}</div>

    </div>

}

/* ─ [G] 갤러리 ─ */
function renderGallery(g){const imgs=g.images.map(img=>`<div class="g-frame"><img src="${img.src}" alt="${img.alt}" loading="lazy"></div>`).join("");return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활동 모습</span><h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2></div><div class="gallery-marquee"><div class="g-track">${imgs}${imgs}</div></div></section>`}

/* ── 진입점 ── */
function renderPage(d) {
  renderMeta(d);

    renderCTA();
  initHeroSlider();
}

renderPage(programData);
