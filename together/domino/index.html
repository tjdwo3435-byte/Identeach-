  { label:"회사소개",       href:"/about" }
];

/* SVG 아이콘 (경험 카드용) — 4개 순환 */
const XP_ICONS = [
  `<svg viewBox="0 0 20 20" fill="none" stroke="#14142B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L12.5 7.5H18L13.5 11L15.5 17L10 13.5L4.5 17L6.5 11L2 7.5H7.5L10 2Z"/></svg>`,
  `<svg viewBox="0 0 20 20" fill="none" stroke="#14142B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><path d="M10 6v4l3 2"/></svg>`,
  `<svg viewBox="0 0 20 20" fill="none" stroke="#14142B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 12.5A7 7 0 116 3.5M9 7l1 2 2 .5"/></svg>`,
  `<svg viewBox="0 0 20 20" fill="none" stroke="#14142B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l4 4 6-7"/></svg>`
];

function nl(str) { return (str||'').replace(/\n/g,'<br>') }

function renderNav(active) {
  const el = document.getElementById('nav-links');
  el.innerHTML = NAV_ITEMS.map(item =>
    `<a href="${item.href}"${item.href===active?' class="nav-active"':''}>${item.label}</a>`
  ).join('');
}

function renderCrumb(crumbs) {
  const el = document.getElementById('pg-crumb');
  el.innerHTML = crumbs.map((c,i) =>
    i < crumbs.length-1
      ? `<a href="${c.href}">${c.label}</a><span class="crumb-sep">›</span>`
      : `<span>${c.label}</span>`
  ).join('');
}

function renderMeta(d) {
  document.getElementById('pg-title').textContent  = d.pageTitle;
  document.getElementById('pg-desc').content       = d.pageDesc;
  document.getElementById('pg-canonical').href     = d.canonicalUrl;
}

function renderHero(d) {
  const imgHtml = d.heroImage.src
    ? `<div class="hero-img-wrap"><img src="${d.heroImage.src}" alt="${d.heroImage.alt}" loading="eager"></div>`
    : `<div class="hero-img-wrap" style="background:var(--border)"></div>`;

  return `
<section class="hero-sec">
  <div class="wrap">
    <div class="hero-grid">
      <div>
        <span class="hero-chip">${d.category}</span>
        <h1 class="hero-title">${nl(d.headline)}</h1>
        <p class="hero-desc">${nl(d.description)}</p>
        <div class="info-grid">
          ${d.info.map(item=>`
          <div class="info-item">
            <div class="info-label">${item.label}</div>
            <div class="info-value">${nl(item.value)}</div>
          </div>`).join('')}
        </div>
      </div>
      ${imgHtml}
    </div>
  </div>
</section>`;
}

function renderPoint(p) {
  return `
<section class="point-sec">
  <div class="wrap">
    <span class="sec-chip">PROGRAM POINT</span>
    <h2 class="sec-h2">${nl(p.title)}</h2>
    <p class="sec-desc">${nl(p.description)}</p>
    <div class="xp-grid">
      ${p.experiences.map((xp,i)=>`
      <div class="xp-card">
        <div class="xp-icon">${XP_ICONS[i%4]}</div>
        <p>${xp}</p>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

function renderUseCases(u) {
  return `
<section class="usecase-sec">
  <div class="wrap">
    <span class="sec-chip">활용 장면</span>
    <h2 class="sec-h2">${nl(u.title)}</h2>
    <div class="uc-grid">
      ${u.cards.map(c=>`
      <div class="uc-card">
        <div class="uc-card-title">${c.title}</div>
        <p>${c.desc}</p>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

function renderProcess(proc) {
  return `
<section class="process-sec">
  <div class="wrap">
    <span class="sec-chip">진행 흐름</span>
    <h2 class="sec-h2" style="margin-bottom:clamp(36px,5vw,52px)">${nl(proc.title)}</h2>
    <div class="proc-row">
      ${proc.steps.map((s,i)=>`
      <div class="proc-step">
        <div class="proc-num">${i+1}</div>
        <div class="proc-body">
          <div class="proc-title">${s.title}</div>
          <div class="proc-desc">${s.desc}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

function renderGallery(g) {
  return `
<section class="gallery-sec">
  <div class="wrap">
    <span class="sec-chip">활동 모습</span>
    <h2 class="sec-h2" style="margin-bottom:clamp(32px,4vw,44px)">${nl(g.title)}</h2>
    <div class="gallery-grid">
      ${g.images.map(img=>`
      <div class="g-item">
        <div class="g-img">
          <img src="${img.src}" alt="${img.alt}" loading="lazy">
        </div>
        <p class="g-caption">${img.caption}</p>
      </div>`).join('')}
    </div>
  </div>
</section>`;
}

/* ── 페이지 진입점 ── */
function renderPage(data) {
  renderMeta(data);
  renderNav(data.navActive);
  renderCrumb(data.crumbs);

  document.getElementById('pg-root').innerHTML =
    renderHero(data) +
    renderPoint(data.point) +
    renderUseCases(data.useCases) +
    renderProcess(data.process) +
    renderGallery(data.gallery);
}

renderPage(programData);
</script>

</body>
</html>
