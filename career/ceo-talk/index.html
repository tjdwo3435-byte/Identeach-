function dp(n,yellow){const c=yellow?'dp dp-y':'dp';return Array.from({length:n},()=>`<div class="${c}"></div>`).join('')}

  if(type==='zones')return`<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="display:flex;gap:14px"><div style="text-align:center"><span style="font-size:9px;color:var(--gray);font-weight:700">팀A</span><br><div class="sv-row">${dp(3)}</div></div><div style="text-align:center"><span style="font-size:9px;color:var(--gray);font-weight:700">팀B</span><br><div class="sv-row">${dp(3)}</div></div><div style="text-align:center"><span style="font-size:9px;color:var(--gray);font-weight:700">팀C</span><br><div class="sv-row">${dp(3)}</div></div></div><div style="font-size:10px;color:var(--gray)">↓ 연결</div><div class="sv-row">${dp(7,true)}</div></div>`;

function renderStudentXP(items){return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">이 활동에서 학생들은</span><div class="xp-grid">${items.map((x,i)=>`<div class="xp-card"><div class="xp-num">${String(i+1).padStart(2,'0')}</div><div class="xp-action">${nl(x.action)}</div><div class="xp-detail">${x.detail}</div></div>`).join('')}</div></div></section>`}
function renderProcess(proc){return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">진행 흐름</span><h2 class="sec-h2">이렇게 진행됩니다</h2><div class="proc-row">${proc.steps.map((s,i)=>`<div class="proc-step"><div class="proc-num">${i+1}</div><div class="proc-body"><div class="proc-title">${s.title}</div><div class="proc-desc">${s.desc}</div></div></div>`).join('')}</div></div></section>`}
function renderStructures(d){const sec=d.structuresSection;return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">${sec.label}</span><h2 class="sec-h2">${sec.title}</h2><div class="struct-grid">${sec.items.map((s,i)=>`<div class="struct-card"><div class="struct-vis">${structVis(s.type,i)}</div><div class="struct-name">${s.name}</div><div class="struct-desc">${s.desc}</div></div>`).join('')}</div></div></section>`}
function renderGallery(g){return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활동 모습</span><h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2><div class="gallery-grid">${g.images.map(img=>`<div class="g-item"><div class="g-frame">${img.src?`<img src="${img.src}" alt="${img.alt}" loading="lazy">`:''}  </div><p class="g-cap">${img.caption}</p></div>`).join('')}</div></div></section>`}
function renderPage(d){renderMeta(d);renderNav(d.navActive);renderCrumb(d.crumbs);document.getElementById('pg-root').innerHTML=renderHero(d)+renderActivity(d.activity)+renderKeywords(d.keywords)+renderStudentXP(d.studentExperiences)+renderProcess(d.process)+renderStructures(d)+renderGallery(d.gallery)}
renderPage(programData);
</script>
</body>
</html>
