const NAV_ITEMS=[{label:"어울림 프로그램",href:"/together"},{label:"진로 프로그램",href:"/career"},{label:"교내 행사",href:"/events"},{label:"회사소개",href:"/about"}];
function nl(s){return(s||'').replace(/\n/g,'<br>')}
function dp(n,yellow){const c=yellow?'dp dp-y':'dp';return Array.from({length:n},()=>`<div class="${c}"></div>`).join('')}

function renderActivity(a){const img=a.image.src?`<img src="${a.image.src}" alt="${a.image.alt}" loading="lazy">`:'';return`<section class="sec sec--warm"><div class="wrap"><div class="activity-grid"><div class="activity-photo">${img}</div><div><span class="activity-eyebrow">PROGRAM OVERVIEW</span><h2 class="activity-h2">${nl(a.headline)}</h2><div class="bullet-list">${a.bullets.map(b=>`<div class="bullet-item"><div class="bullet-dot"></div><span>${b}</span></div>`).join('')}</div></div></div></div></section>`}
function renderKeywords(kws){return`<section class="sec sec--white"><div class="wrap"><div class="kw-sec-title">활용 장면</div><h2 class="kw-h2">어디서, 언제 쓸 수 있나요?</h2><div class="kw-wrap">${kws.map(k=>`<span class="kw-chip kw-chip--${k.type}">${k.label}</span>`).join('')}</div></div></section>`}
function renderStudentXP(items){return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">이 활동에서 학생들은</span><div class="xp-grid">${items.map((x,i)=>`<div class="xp-card"><div class="xp-num">${String(i+1).padStart(2,'0')}</div><div class="xp-action">${nl(x.action)}</div><div class="xp-detail">${x.detail}</div></div>`).join('')}</div></div></section>`}
function renderProcess(proc){return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">진행 흐름</span><h2 class="sec-h2">이렇게 진행됩니다</h2><div class="proc-row">${proc.steps.map((s,i)=>`<div class="proc-step"><div class="proc-num">${s.icon||i+1}</div><div class="proc-body"><div class="proc-title">${s.title}</div><div class="proc-desc">${s.desc}</div></div></div>`).join('')}</div></div></section>`}
function renderStructures(d){const sec=d.structuresSection;return`<section class="sec sec--warm"><div class="wrap"><span class="sec-label">${sec.label}</span><h2 class="sec-h2">${sec.title}</h2><div class="struct-grid">${sec.items.map((s,i)=>`<div class="struct-card"><div class="struct-vis">${structVis(s.type,i)}</div><div class="struct-name">${s.name}</div><div class="struct-desc">${s.desc}</div></div>`).join('')}</div></div></section>`}
function renderGallery(g){const imgs=g.images.map(img=>`<div class="g-frame"><img src="${img.src}" alt="${img.alt}" loading="lazy"></div>`).join("");return`<section class="sec sec--white"><div class="wrap"><span class="sec-label">활동 모습</span><h2 class="sec-h2" style="margin-bottom:0">현장 사진</h2></div><div class="gallery-marquee"><div class="g-track">${imgs}${imgs}</div></div></section>`}

function renderCTA(){return`<div style="position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;align-items:flex-end"><a href="/assets/documents/identeach-program-guide.pdf" download style="display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy);font-family:inherit;font-weight:800;font-size:14px;padding:13px 22px;border-radius:18px 18px 0 18px;text-decoration:none;box-shadow:0 6px 24px rgba(20,20,43,.28);white-space:nowrap">📄 프로그램 소개서 받기</a><div style="width:0;height:0;border-style:solid;border-width:12px 12px 0 0;border-color:var(--yellow) transparent transparent transparent"></div></div>`}
function renderPage(d){renderMeta(d);renderNav(d.navActive);renderCrumb(d.crumbs);document.getElementById('pg-root').innerHTML=renderHero(d)+renderActivity(d.activity)+renderKeywords(d.keywords)+renderStudentXP(d.studentExperiences)+renderProcess(d.process)+renderGallery(d.gallery)+renderCTA()}
renderPage(programData);
  </script>
</body>
</html>
